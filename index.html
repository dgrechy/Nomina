<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nomina Face Trainer Pro</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --accent: #38BDF8;
      --text: #F8FAFC;
    }
    body {
      margin: 0; padding: 0; background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text); display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh;
      overflow: hidden; user-select: none;
    }
    #game-container {
      width: 90vw; max-width: 420px; height: 85vh;
      background: var(--card-bg); border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; align-items: center;
      justify-content: space-between; padding: 24px; box-sizing: border-box;
      position: relative;
    }
    .phase-title { 
      font-size: 14px; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      color: var(--accent); 
      font-weight: bold; 
      margin-bottom: 10px;
    }
    #display-area { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin: 20px 0; }
    #target-image { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 4px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    #target-name { font-size: 28px; font-weight: 800; margin-top: 20px; text-align: center; }
    #rasp-instructions { font-size: 15px; color: #94A3B8; text-align: center; max-width: 90%; line-height: 1.5; margin-top: 10px; }
    input[type="text"] {
      width: 85%; padding: 14px; border-radius: 12px; border: 2px solid #334155;
      background: #0F172A; color: white; font-size: 18px; text-align: center; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .btn {
      width: 85%; padding: 16px; border-radius: 14px; border: none;
      background: var(--accent); color: #0F172A; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: transform 0.1s ease; margin-bottom: 10px;
    }
    .btn:active { transform: scale(0.98); }
    #feedback-zone { display: none; width: 100%; flex-direction: column; align-items: center; }
    .feedback-btn { width: 100%; padding: 12px; margin: 4px 0; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; }
    .easy { background: #10B981; } .medium { background: #F59E0B; } .hard { background: #EF4444; }
  </style>
</head>
<body>

<div id="game-container">
  <div class="phase-title" id="phase-label">Initializing...</div>

  <div id="display-area">
    <img id="target-image" src="" alt="Neural Target" style="display:none;">
    <div id="target-name"></div>
    <div id="rasp-instructions">Building face database matrices...</div>
    <div id="input-container" style="display:none; width:100%; text-align:center;">
      <input type="text" id="recall-input" placeholder="Type..." autocomplete="off">
    </div>
  </div>

  <button class="btn" id="action-btn" onclick="advanceStep()" style="display:none;">Next</button>
  
  <div id="feedback-zone">
    <div style="font-size:12px; margin-bottom:8px; color:#94A3B8;">Rate your memory access speed:</div>
    <button class="feedback-btn easy" onclick="submitFeedback(5)">Instant / Clear</button>
    <button class="feedback-btn medium" onclick="submitFeedback(3)">Took Mental Effort</button>
    <button class="feedback-btn hard" onclick="submitFeedback(1)">Total Blackout</button>
  </div>
</div>

<script>
  // Comprehensive array mapping the top popular United States first names
  const usNamesM = ["Liam", "Noah", "Oliver", "Elijah", "James", "William", "Benjamin", "Lucas", "Henry", "Alexander", "Mason", "Michael", "Ethan", "Daniel", "Jacob", "Logan", "Jackson", "Levi", "Sebastian", "Mateo", "Jack", "Owen", "Theodore", "Aiden", "Samuel", "Joseph", "John", "David", "Wyatt", "Luke", "Asher", "Carter", "Julian", "Grayson", "Leo", "Jayden", "Gabriel", "Isaac", "Lincoln", "Anthony", "Hudson", "Dylan", "Ezra", "Thomas", "Charles", "Christopher", "Jaxon", "Maverick", "Josiah", "Isaiah", "Andrew", "Elias", "Joshua", "Nathan", "Caleb", "Ryan", "Adrian", "Miles", "Eli", "Nolan", "Christian", "Aaron", "Cameron", "Ezekiel", "Colton", "Luca", "Landon", "Hunter", "Jonathan", "Santiago", "Axel", "Brooks", "Ian", "Jameson", "Cooper", "Angel", "Dominic", "Amari", "Jordan", "Kai", "Nova", "Silas", "Felix", "Victor", "Marcus"];
  const usNamesF = ["Olivia", "Emma", "Charlotte", "Amelia", "Sophia", "Ava", "Isabella", "Mia", "Evelyn", "Harper", "Luna", "Camila", "Gianna", "Elizabeth", "Eleanor", "Ella", "Avery", "Sofia", "Violet", "Aurora", "Hazel", "Aria", "Scarlett", "Naomi", "Ellie", "Claire", "Lily", "Maya", "Nova", "Isla", "Elena", "Zoe", "Stella", "Grace", "Chloe", "Victoria", "Riley", "Aniyah", "Zoey", "Penelope", "Layla", "Aaliyah", "Nora", "Mila", "Hannah", "Lillian", "Addison", "Aubrey", "Natalie", "Leah", "Savannah", "Skyler", "Willow", "Paisley", "Audrey", "Brooklyn", "Bella", "Lucy", "Anna", "Caroline", "Kennedy", "Valentina", "Ruby", "Eva", "Alice", "Sadie", "Natalia", "Gabriella", "Autumn", "Quinn", "Cora", "Jade", "Piper"];

  let mockDatabase = [];
  let currentCard = null;
  let lastCardId = null; 
  let phase = 1; 
  let customUserAnchor = ""; 
  
  // Cache Wiper variables
  let currentString = "";
  let expectedString = "";
  let jammerRound = 1;

  function generateUSFaceMatrix() {
    mockDatabase = [];
    let idCounter = 1;
    // Generate clean studio headshots paired with names
    for (let i = 0; i < 100; i++) {
      mockDatabase.push({ id: idCounter++, name: usNamesM[i % usNamesM.length], img: `https://randomuser.me/api/portraits/men/${i}.jpg` });
      mockDatabase.push({ id: idCounter++, name: usNamesF[i % usNamesF.length], img: `https://randomuser.me/api/portraits/women/${i}.jpg` });
    }
  }

  function initSession() {
    if (mockDatabase.length === 0) generateUSFaceMatrix();
    let pool = mockDatabase.filter(card => card.id !== lastCardId);
    currentCard = pool[Math.floor(Math.random() * pool.length)];
    lastCardId = currentCard.id; 
    jammerRound = 1;
    customUserAnchor = "";
    startPhase1();
  }

  // Phase 1: Unlimited scan time to explore the facial canvas
  function startPhase1() {
    phase = 1;
    document.getElementById('input-container').style.display = "none";
    document.getElementById('phase-label').innerText = "Phase 1: Feature Extraction";
    
    const targetImg = document.getElementById('target-image');
    targetImg.src = currentCard.img;
    targetImg.style.display = "block";
    targetImg.style.filter = "none";
    
    document.getElementById('target-name').innerText = "";
    document.getElementById('rasp-instructions').innerHTML = "Take your time to scan this face. Locate **one** highly distinct structural feature (e.g., eye slant, jawline shape, hair parting, lip structure).";
    document.getElementById('action-btn').innerText = "I Found An Anchor";
    document.getElementById('action-btn').style.display = "block";
  }

  // Phase 1B: Input text window to explicitly write down the marker
  function startPhase1B() {
    phase = 15; 
    document.getElementById('phase-label').innerText = "Lock Visual Anchor";
    document.getElementById('rasp-instructions').innerText = "Type the specific feature you isolated (e.g., 'right eyebrow arch', 'pursed lips'):";
    document.getElementById('action-btn').style.display = "none";
    document.getElementById('input-container').style.display = "block";
    document.getElementById('recall-input').placeholder = "Press Enter to save...";
    document.getElementById('recall-input').value = "";
    document.getElementById('recall-input').focus();
  }

  // Phase 2: Show the target name and bind it via RASP logic
  function startPhase2() {
    phase = 2;
    document.getElementById('input-container').style.display = "none";
    document.getElementById('phase-label').innerText = "Phase 2: RASP Encoding Loop";
    document.getElementById('target-name').innerText = currentCard.name;
    document.getElementById('rasp-instructions').innerHTML = `Bind the name <b>${currentCard.name}</b> to your anchor: <span style="color:var(--accent); font-weight:bold;">"${customUserAnchor}"</span>.<br><br><b>R</b>epeat | <b>A</b>ssociate | <b>S</b>peak aloud | <b>P</b>icture it melting together.`;
    document.getElementById('action-btn').innerText = "Begin Cache Wipe";
    document.getElementById('action-btn').style.display = "block";
  }

  function generate6CharacterCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; 
    let str = "";
    for (let i = 0; i < 6; i++) {
      str += chars.charAt(Math.floor(Math.random() * chars.length)) + " ";
    }
    currentString = str.trim();
    expectedString = currentString.replace(/\s+/g, '');
  }

  // Phase 3: Display 6 characters forward to completely flush audio loop mechanisms
  function startPhase3() {
    phase = 3;
    document.getElementById('target-image').style.filter = "brightness(0)"; 
    document.getElementById('target-name').innerText = "";
    document.getElementById('action-btn').style.display = "none";
    document.getElementById('phase-label').innerText = `Phase 3: Cognitive Flush (${jammerRound}/2)`;
    
    generate6CharacterCode();
    
    document.getElementById('rasp-instructions').innerHTML = `Type this code exactly as shown to clear short-term rehearsal pathways:<br><br><b style="font-size:36px; color:white; letter-spacing:4px;">${currentString}</b>`;
    document.getElementById('input-container').style.display = "block";
    document.getElementById('recall-input').placeholder = "Type code forward...";
    document.getElementById('recall-input').value = "";
    document.getElementById('recall-input').focus();
  }

  // Phase 4: Prompt name recall utilizing custom anchor
  function startPhase4() {
    phase = 4;
    document.getElementById('target-image').style.filter = "none";
    document.getElementById('phase-label').innerText = "Phase 4: Synaptic Retrieval";
    document.getElementById('rasp-instructions').innerHTML = `Recall the name linked to your anchor: <span style="color:var(--accent); font-weight:bold;">"${customUserAnchor}"</span>`;
    document.getElementById('input-container').style.display = "block";
    document.getElementById('recall-input').placeholder = "Type first name...";
    document.getElementById('recall-input').value = "";
    document.getElementById('recall-input').focus();
  }

  // Universal button navigator for non-input phases (Phases 1, 2, and 5)
  function advanceStep() {
    if (phase === 1) startPhase1B();
    else if (phase === 2) startPhase3();
    else if (phase === 5) {
      initSession();
    }
  }

  // Universal text input event controller
  document.getElementById('recall-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      const inputVal = this.value.trim();

      if (phase === 15) {
        if (inputVal.length > 1) {
          customUserAnchor = this.value.trim();
          startPhase2();
        }
      } else if (phase === 3) {
        const cleanInput = inputVal.toUpperCase().replace(/\s+/g, '');
        if (cleanInput === expectedString) {
          if (jammerRound >= 2) {
            startPhase4();
          } else {
            jammerRound++;
            startPhase3(); // Start second round of 6 characters
          }
        } else {
          this.value = ""; // Clears wrong characters, lets you re-type cleanly
        }
      } else if (phase === 4) {
        const targetVal = currentCard.name.toLowerCase();
        document.getElementById('input-container').style.display = "none";

        if (inputVal.toLowerCase() === targetVal) {
          document.getElementById('target-name').innerText = currentCard.name;
          document.getElementById('phase-label').innerText = "Success: Circuit Active";
          document.getElementById('feedback-zone').style.display = "flex";
        } else {
          phase = 5;
          document.getElementById('target-name').innerText = currentCard.name;
          document.getElementById('phase-label').innerText = "Link Fractured";
          document.getElementById('rasp-instructions').innerHTML = `You typed: <span style="color:#EF4444;">"${this.value}"</span>.<br><br>The correct name was <b>${currentCard.name}</b>.<br>Your visual anchor was: <b>"${customUserAnchor}"</b>.<br><br>Intentionally study the face and map the name back to that anchor point before continuing.`;
          document.getElementById('action-btn').innerText = "Continue Training";
          document.getElementById('action-btn').style.display = "block";
        }
      }
    }
  });

  function submitFeedback(qualityScore) {
    document.getElementById('feedback-zone').style.display = "none";
    initSession();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  window.onload = generateUSFaceMatrix; 
  window.addEventListener('load', initSession);
</script>
</body>
</html>
