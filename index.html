<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nomina Batch Trainer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --accent: #38BDF8;
      --text: #F8FAFC;
    }
    body {
      margin: 0; padding: 0; background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text); display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh;
      overflow: hidden; user-select: none;
    }
    #game-container {
      width: 90vw; max-width: 420px; height: 85vh;
      background: var(--card-bg); border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; align-items: center;
      justify-content: space-between; padding: 24px; box-sizing: border-box;
      position: relative;
    }
    .phase-title { 
      font-size: 14px; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      color: var(--accent); 
      font-weight: bold; 
      margin-bottom: 10px;
    }
    #batch-counter {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 600;
      background: #0F172A;
      padding: 4px 12px;
      border-radius: 20px;
    }
    #display-area { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin: 15px 0; min-height: 50%; }
    #target-image { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 4px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    #target-name { font-size: 28px; font-weight: 800; margin-top: 15px; text-align: center; }
    #rasp-instructions { font-size: 15px; color: #94A3B8; text-align: center; max-width: 90%; line-height: 1.5; margin-top: 10px; }
    
    input[type="text"] {
      width: 85%; padding: 14px; border-radius: 12px; border: 2px solid #334155;
      background: #0F172A; color: white; font-size: 18px; text-align: center; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    .btn {
      width: 85%; padding: 16px; border-radius: 14px; border: none;
      background: var(--accent); color: #0F172A; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: transform 0.1s ease; margin-bottom: 10px;
    }
    .btn:active { transform: scale(0.98); }
    #feedback-zone { display: none; width: 100%; flex-direction: column; align-items: center; }
    .feedback-btn { width: 100%; padding: 12px; margin: 4px 0; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; }
    .easy { background: #10B981; } .medium { background: #F59E0B; } .hard { background: #EF4444; }
  </style>
</head>
<body>

<div id="game-container">
  <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
    <div class="phase-title" id="phase-label">Initializing...</div>
    <div id="batch-counter">0 / 10</div>
  </div>

  <div id="display-area">
    <img id="target-image" src="" alt="Neural Target" style="display:none;">
    <div id="target-name"></div>
    <div id="rasp-instructions">Compiling US demographic naming models...</div>
    
    <div id="input-container" style="display:none; width:100%; text-align:center; margin-top:15px;">
      <input type="text" id="recall-input" placeholder="Type..." autocomplete="off">
    </div>
  </div>

  <button class="btn" id="action-btn" onclick="advanceStep()" style="display:none;">Next</button>
  
  <div id="feedback-zone">
    <div style="font-size:12px; margin-bottom:8px; color:#94A3B8;">Rate your memory access speed:</div>
    <button class="feedback-btn easy" onclick="submitFeedback(5)">Instant / Clear</button>
    <button class="feedback-btn medium" onclick="submitFeedback(3)">Took Mental Effort</button>
    <button class="feedback-btn hard" onclick="submitFeedback(1)">Total Blackout</button>
  </div>
</div>

<script>
  const usNamesM = ["Liam", "Noah", "Oliver", "Elijah", "James", "William", "Benjamin", "Lucas", "Henry", "Alexander", "Mason", "Michael", "Ethan", "Daniel", "Jacob", "Logan", "Jackson", "Levi", "Sebastian", "Mateo", "Jack", "Owen", "Theodore", "Aiden", "Samuel", "Joseph", "John", "David", "Wyatt", "Luke", "Asher", "Carter", "Julian", "Grayson", "Leo", "Jayden", "Gabriel", "Isaac", "Lincoln", "Anthony", "Hudson", "Dylan", "Ezra", "Thomas", "Charles", "Christopher", "Jaxon", "Maverick", "Josiah", "Isaiah", "Andrew", "Elias", "Joshua", "Nathan", "Caleb", "Ryan", "Adrian", "Miles", "Eli", "Nolan", "Christian", "Aaron", "Cameron", "Ezekiel", "Colton", "Luca", "Landon", "Hunter", "Jonathan", "Santiago", "Axel", "Brooks", "Ian", "Jameson", "Cooper", "Angel", "Dominic", "Amari", "Jordan", "Kai", "Nova", "Silas", "Felix", "Victor", "Marcus"];
  const usNamesF = ["Olivia", "Emma", "Charlotte", "Amelia", "Sophia", "Ava", "Isabella", "Mia", "Evelyn", "Harper", "Luna", "Camila", "Gianna", "Elizabeth", "Eleanor", "Ella", "Avery", "Sofia", "Violet", "Aurora", "Hazel", "Aria", "Scarlett", "Naomi", "Ellie", "Claire", "Lily", "Maya", "Nova", "Isla", "Elena", "Zoe", "Stella", "Grace", "Chloe", "Victoria", "Riley", "Aniyah", "Zoey", "Penelope", "Layla", "Aaliyah", "Nora", "Mila", "Hannah", "Lillian", "Addison", "Aubrey", "Natalie", "Leah", "Savannah", "Skyler", "Willow", "Paisley", "Audrey", "Brooklyn", "Bella", "Lucy", "Anna", "Caroline", "Kennedy", "Valentina", "Ruby", "Eva", "Alice", "Sadie", "Natalia", "Gabriella", "Autumn", "Quinn", "Cora", "Jade", "Piper"];

  let masterFacePool = [];
  
  // Batch Management States
  let currentBatchCards = [];  // Holds the 10 cards being learned
  let testingBatchPool = [];   // Holds the 5 cards selected for evaluation
  let currentCard = null;
  let currentBatchIndex = 0;   
  let phase = 1;               // 1: Scan, 15: Type Anchor, 2: Encode Name, 4: Recall, 5: Review
  let tempAnchorStorage = "";

  function generateUSFaceMatrix() {
    masterFacePool = [];
    let idCounter = 1;
    for (let i = 0; i < 120; i++) {
      masterFacePool.push({ id: idCounter++, name: usNamesM[i % usNamesM.length], img: `https://randomuser.me/api/portraits/men/${i}.jpg`, anchor: "" });
      masterFacePool.push({ id: idCounter++, name: usNamesF[i % usNamesF.length], img: `https://randomuser.me/api/portraits/women/${i}.jpg`, anchor: "" });
    }
  }

  // Assembles 10 fresh, completely unique faces for the encoding phase
  function startNewBatchIteration() {
    if (masterFacePool.length === 0) generateUSFaceMatrix();
    
    currentBatchCards = [];
    testingBatchPool = [];
    currentBatchIndex = 0;
    
    // Pick 10 random cards from the pool
    let shuffled = [...masterFacePool].sort(() => Math.random() - 0.5);
    for(let i = 0; i < 10; i++) {
      // Deep clone object to ensure clean anchor overwrites per batch run
      currentBatchCards.push({ ...shuffled[i] }); 
    }
    
    loadNextEncodingCard();
  }

  function loadNextEncodingCard() {
    if (currentBatchIndex < 10) {
      currentCard = currentBatchCards[currentBatchIndex];
      document.getElementById('batch-counter').innerText = `${currentBatchIndex + 1} / 10`;
      startPhase1();
    } else {
      // All 10 cards encoded. Select 5 random cards for testing.
      document.getElementById('batch-counter').innerText = "TEST MODE";
      testingBatchPool = [...currentBatchCards].sort(() => Math.random() - 0.5).slice(0, 5);
      currentBatchIndex = 0; // Reset counter to track test completion
      loadNextTestingCard();
    }
  }

  // Step 1: Scan face
  function startPhase1() {
    phase = 1;
    document.getElementById('input-container').style.display = "none";
    document.getElementById('phase-label').innerText = "1. Feature Scan";
    
    const targetImg = document.getElementById('target-image');
    targetImg.src = currentCard.img;
    targetImg.style.display = "block";
    targetImg.style.filter = "none";
    
    document.getElementById('target-name').innerText = "";
    document.getElementById('rasp-instructions').innerHTML = "Scan this profile. Isolate **one** highly distinct physical anchor point.";
    document.getElementById('action-btn').innerText = "I Have Found An Anchor";
    document.getElementById('action-btn').style.display = "block";
  }

  // Step 1B: Input the feature to lock it in
  function startPhase1B() {
    phase = 15; 
    document.getElementById('phase-label').innerText = "Lock Anchor Tag";
    document.getElementById('rasp-instructions').innerText = "Type the physical feature you isolated:";
    document.getElementById('action-btn').style.display = "none";
    document.getElementById('input-container').style.display = "block";
    document.getElementById('recall-input').placeholder = "Press Enter to save...";
    document.getElementById('recall-input').value = "";
    document.getElementById('recall-input').focus();
  }

  // Step 2: Show name and complete the RASP link mapping
  function startPhase2() {
    phase = 2;
    document.getElementById('input-container').style.display = "none";
    document.getElementById('phase-label').innerText = "2. Bind Name Target";
    document.getElementById('target-name').innerText = currentCard.name;
    document.getElementById('rasp-instructions').innerHTML = `Bind the name <b>${currentCard.name}</b> to your anchor: <span style="color:var(--accent); font-weight:bold;">"${currentCard.anchor}"</span>.<br><br>Execute RASP protocol mapping, then click Next to queue the next profile entry.`;
    document.getElementById('action-btn').innerText = "Queue Next Profile";
    document.getElementById('action-btn').style.display = "block";
  }

  /* --- TESTING INTERFACE OPERATIONS --- */

  function loadNextTestingCard() {
    if (currentBatchIndex < 5) {
      currentCard = testingBatchPool[currentBatchIndex];
      document.getElementById('batch-counter').innerText = `Test: ${currentBatchIndex + 1} / 5`;
      startPhase4Test();
    } else {
      // 5-card test complete. Clear variables and start next block.
      document.getElementById('phase-label').innerText = "Batch Complete";
      document.getElementById('target-image').style.display = "none";
      document.getElementById('target-name').innerText = "Session Synced";
      document.getElementById('rasp-instructions').innerHTML = "You have completed this batch block. Click below to compile a fresh set of 10 profiles.";
      document.getElementById('action-btn').innerText = "Load Next 10 Faces";
      document.getElementById('action-btn').style.display = "block";
      phase = 6; // Fresh initialization routing state
    }
  }

  function startPhase4Test() {
    phase = 4;
    document.getElementById('target-image').style.display = "block";
    document.getElementById('target-image').style.filter = "none";
    document.getElementById('target-name').innerText = "";
    document.getElementById('phase-label').innerText = "Synaptic Retrieval Test";
    document.getElementById('rasp-instructions').innerHTML = `Recall the identity linked to this anchor:<br><span style="color:var(--accent); font-weight:bold; font-size:18px;">"${currentCard.anchor}"</span>`;
    document.getElementById('action-btn').style.display = "none";
    document.getElementById('input-container').style.display = "block";
    document.getElementById('recall-input').placeholder = "Type first name...";
    document.getElementById('recall-input').value = "";
    document.getElementById('recall-input').focus();
  }

  function evaluateTestSubmission(inputString) {
    document.getElementById('input-container').style.display = "none";
    const targetVal = currentCard.name.toLowerCase();

    if (inputString.trim().toLowerCase() === targetVal) {
      document.getElementById('target-name').innerText = currentCard.name;
      document.getElementById('phase-label').innerText = "Link Verified";
      document.getElementById('feedback-zone').style.display = "flex";
    } else {
      phase = 5; // Error Correction Review Phase
      document.getElementById('target-name').innerText = currentCard.name;
      document.getElementById('phase-label').innerText = "Link Fractured (15% Rule)";
      document.getElementById('rasp-instructions').innerHTML = `You typed: <span style="color:#EF4444;">"${inputString || "Empty Entry"}"</span>.<br><br>The correct profile target was <b>${currentCard.name}</b>.<br>Your custom anchor text was: <b>"${currentCard.anchor}"</b>.<br><br>Re-examine the profile and re-map the identity before proceeding.`;
      document.getElementById('action-btn').innerText = "Continue Test";
      document.getElementById('action-btn').style.display = "block";
    }
  }

  function advanceStep() {
    if (phase === 1) {
      startPhase1B();
    } else if (phase === 2) {
      currentBatchIndex++;
      loadNextEncodingCard();
    } else if (phase === 5) {
      document.getElementById('action-btn').style.display = "none";
      currentBatchIndex++;
      loadNextTestingCard();
    } else if (phase === 6) {
      document.getElementById('action-btn').style.display = "none";
      startNewBatchIteration();
    }
  }

  function submitFeedback(qualityScore) {
    document.getElementById('feedback-zone').style.display = "none";
    currentBatchIndex++;
    loadNextTestingCard();
  }

  // Text Enter evaluation router
  document.getElementById('recall-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      const val = this.value.trim();
      if (phase === 15) {
        if (val.length > 1) {
          currentCard.anchor = val; // Save anchor into active card tracking instance
          startPhase2();
        }
      } else if (phase === 4) {
        evaluateTestSubmission(val);
      }
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  window.onload = startNewBatchIteration;
</script>
</body>
</html>
